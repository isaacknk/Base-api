<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Administrador</title>
    <link rel="shortcut icon" href="https://telegra.ph/file/74d3cdc892549ae5d7656.jpg">
    <link rel="stylesheet" href="ajax/libs/limonte-sweetalert2/7.33.1/sweetalert2.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style2.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .card-header h1 {
            font-weight: bold;
            color: #007bff; /* Azul */
        }

        .form-control {
            background-color: #333;
            color: white !important; /* Texto branco */
            border: 1px solid #555;
            padding: 15px;
            border-radius: 8px;
        }

        .form-control::placeholder {
            color: #bbb;
        }

        .form-control:focus {
            box-shadow: none;
            border: 1px solid #007bff; /* Azul */
            background-color: #444;
            color: white !important; /* Garante que o texto continue branco ao digitar */
        }

        .btn-primary {
            background-color: #007bff; /* Azul */
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            background-color: #0056b3; /* Azul mais escuro */
        }

        h2 {
            margin-top: 20px;
            font-size: 14px;
            color: #bbb;
            font-weight: bold;
        }

        .status {
            color: #007bff; /* Azul */
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button i {
            margin-right: 8px;
        }

        .form-control, .btn-primary {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Formulário de Adicionar Key -->
        <form action="/api/add-key">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h1>PAINEL ADMINISTRATIVO</h1>
            </div>
            <h4>ADICIONAR KEY</h4>
            <div class="card-body">
                <p class="status" style="font-size: 17px;"></p>
                <div class="form-group">
                    <input class="form-control font-weight-bold text-center" type="text" placeholder="key&senha&limite" name="a" required>
                </div>
                <div class="form-group btn-container">
                    <button type="submit" class="btn btn-primary">
                        <i class="mdi mdi-arrow-right-bold-hexagon-outline"></i> 
                        <span>Adicionar</span>
                    </button>
                </div>
            </div>
        </form>

        <!-- Formulário de Deletar Key -->
        <form action="/api/del-key">
            <h4>DELETAR KEY</h4>
            <div class="card-body">
                <p class="status" style="font-size: 17px;"></p>
                <div class="form-group">
                    <input class="form-control font-weight-bold text-center" type="text" placeholder="key&senha" name="a" required>
                </div>
                <div class="form-group btn-container">
                    <button type="submit" class="btn btn-primary">
                        <i class="mdi mdi-arrow-right-bold-hexagon-outline"></i> 
                        <span>Deletar</span>
                    </button>
                </div>
            </div>
        </form>

        <!-- Rodapé -->
        <h2>Sandro API © 2025</h2>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</body>
</html>
